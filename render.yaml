services:
  - type: web
    name: salone-auto-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: salone-auto-db
          property: connectionString
      # Da inserire a mano nella dashboard Render (mai in questo file):
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      # URL esatto del frontend deployato (aggiornabile in seguito).
      - key: ALLOWED_ORIGIN
        sync: false

databases:
  - name: salone-auto-db
    plan: free
