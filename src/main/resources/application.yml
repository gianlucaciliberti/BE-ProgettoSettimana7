spring:
  application:
    name: salone-auto

  # In locale usa questi default. Su Render, DatabaseUrl.java legge la
  # DATABASE_URL che Render fornisce (formato postgres://utente:pass@host/db)
  # e sovrascrive url/username/password con priorità più alta di questo file.
  datasource:
    url: jdbc:postgresql://localhost:5432/salone_auto
    username: salone
    password: salone

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: 1440
  admin:
    email: ${ADMIN_EMAIL:amministratore@salone-auto.local}
    password: ${ADMIN_PASSWORD:}
  cors:
    allowed-origin: ${ALLOWED_ORIGIN:http://localhost:5173}
