spring:
  application:
    name: salone-auto

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/salone_auto}
    username: ${DATABASE_USERNAME:salone}
    password: ${DATABASE_PASSWORD:salone}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: 1440
  admin:
    password: ${ADMIN_PASSWORD:}
  cors:
    allowed-origin: ${ALLOWED_ORIGIN:http://localhost:5173}
